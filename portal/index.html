<style>
/* Layout: slim white sidebar (bottom tab bar on phones), pale canvas, white cards. One blue accent, semantic green/amber/red. */
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#0f1a33; --sub:#5a6785; --line:#e4e9f3; --soft:#f0f4fc;
  --blue:#2563eb; --blue2:#dbe7ff; --violet:#7c5cff; --green:#12a36b; --green2:#d9f4e8;
  --amber:#e69500; --amber2:#fff0cf; --red:#e0414b; --red2:#fde4e6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}

/* login */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#e9f0ff,#f6f8fd 60%)}
.gbox{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:0 20px 60px rgba(30,60,130,.12)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.gbox label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 6px}
.gbox select,.gbox input{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit}
.gbox .go{margin-top:18px;width:100%;padding:13px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;text-align:center}
#err{color:var(--red);min-height:18px;margin-top:8px;font-size:13px}

/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin}
.side .brand{padding:4px 10px 18px}
.nav{flex-shrink:0;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--sub);font-weight:600;width:100%}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav[aria-current="page"]{background:var(--blue2);color:var(--blue)}
.sidefoot{margin-top:auto;flex-shrink:0;display:flex;flex-direction:column;gap:8px;padding:6px}
.who{font-size:12px;color:var(--sub)}
.btn{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;background:#fff;text-align:center}
.btn[aria-pressed="true"]{background:var(--amber2);border-color:var(--amber);color:#7a4d00}
main{padding:24px 28px 70px;min-width:0;max-width:1320px;width:100%}
.head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.head h1{font-size:24px;font-weight:800}
.head p{margin:3px 0 0;color:var(--sub)}
.stamp{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:600;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.stamp b{width:8px;height:8px;border-radius:50%;background:var(--green)}
.demo-banner{display:none;margin-bottom:14px;background:var(--amber2);border:1px solid var(--amber);color:#7a4d00;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
body.demo .demo-banner{display:block}
body.demo .x{filter:blur(7px);user-select:none}

/* cards */
.grid{display:grid;gap:14px}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,40,90,.04);min-width:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:600;color:var(--sub);font-size:12px}
a.card,button.card{display:block;width:100%}
button.card:hover,a.card:hover{border-color:#b9cdf7}
.kpi .lbl{color:var(--sub);font-weight:600;font-size:12px;display:flex;gap:8px;align-items:center}
.kpi .lbl i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.kpi .lbl svg{width:15px;height:15px}
.kpi .val{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--sub)}
.b-blue{background:var(--blue2);color:var(--blue)}.b-green{background:var(--green2);color:var(--green)}.b-amber{background:var(--amber2);color:var(--amber)}.b-red{background:var(--red2);color:var(--red)}.b-vio{background:#e9e3ff;color:var(--violet)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.chip.g{background:var(--green2);color:#0b7a50}.chip.a{background:var(--amber2);color:#8a5a00}.chip.r{background:var(--red2);color:#b52c36}.chip.b{background:var(--blue2);color:#1d4fc4}
button.chip{cursor:pointer}
.up{color:var(--green);font-weight:700}

/* lists */
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.item b{display:block}
.item span.s{color:var(--sub);font-size:12.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:11px;color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.meter{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}
.meter b{display:block;height:100%;border-radius:9px}
.hb{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:9px 0}
.hb .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{text-align:right;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.sc{overflow-x:auto}
