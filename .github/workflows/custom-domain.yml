# Keeps the site on the right custom domain, on its own.
# Runs every 30 minutes:
#   If wayneflow.com points at GitHub Pages -> make sure the site uses wayneflow.com.
#   Otherwise do nothing. wayneflow.com is the only domain; there is no backup domain.
# Then turns on HTTPS once GitHub's certificate is ready.
name: Connect custom domain

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/custom-domain.yml"]

permissions:
  contents: write
  pages: write

env:
  MAIN: wayneflow.com

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick domain
        id: dns
        run: |
          ready() {
            A=$(dig +short "$1" A @1.1.1.1 | sort | tr '\n' ' ')
            echo "$1 A records: $A"
            for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
              case " $A " in *" $ip "*) return 0 ;; esac
            done
            return 1
          }
          target=""
          if ready "$MAIN"; then target="$MAIN"; fi
          echo "Chosen domain: ${target:-none}"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Write CNAME file
        if: steps.dns.outputs.target != ''
        env:
          T: ${{ steps.dns.outputs.target }}
        run: |
          if [ "$(cat CNAME 2>/dev/null)" != "$T" ]; then
            OLD=$(cat CNAME 2>/dev/null || echo "")
            echo "$T" > CNAME
            # point canonical links, sitemap, robots, share tags and schema at the new domain
            [ -n "$OLD" ] && grep -rl "https://$OLD" --include='*.html' --include='*.xml' --include='*.txt' . | xargs -r sed -i "s#https://$OLD#https://$T#g"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Use $T as the site domain (DNS is live)"
            git push
          else
            echo "CNAME already $T"
          fi

      - name: Set domain and turn on HTTPS
        if: steps.dns.outputs.target != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T: ${{ steps.dns.outputs.target }}
        run: |
          cur=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // ""' || echo "")
          echo "Pages domain now: $cur"
          if [ "$cur" != "$T" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -f cname="$T" || true
          fi
          state=$(gh api "repos/${{ github.repository }}/pages" --jq '.https_certificate.state // "none"' || echo none)
          echo "Certificate state: $state"
          if [ "$state" = "approved" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -F https_enforced=true || true
          fi
