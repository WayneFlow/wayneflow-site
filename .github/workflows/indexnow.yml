# Tells Bing / Copilot / Yandex / Seznam (IndexNow) about every page whenever the site changes.
name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages to publish
        run: sleep 90
      - name: Submit URLs
        run: |
          HOST=$(cat CNAME)
          KEY=$(ls *.txt | grep -E '^[a-f0-9]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#<loc>##;s#</loc>##' | sed "s#https://[^/]*#https://$HOST#" | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "Host: $HOST  Key: $KEY"
          curl -s -o /dev/null -w "IndexNow status: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}"
